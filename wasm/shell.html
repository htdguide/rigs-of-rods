<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>Rigs of Rods (wasm)</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #canvas{display:block;width:100vw;height:100vh;background:#000}
  #status{position:fixed;top:8px;left:8px;color:#7cf;font:13px monospace}
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">loading…</div>
<script>
  // Emscripten module shell for the Ogre/GLES2 (WebGL2) render window.
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function(t){ console.log(t); },
    printErr: function(t){ console.error(t); },
    setStatus: function(t){ if (t) statusEl.textContent = t; else statusEl.style.display='none'; },
  };

  // OpenAL (Web Audio) starts suspended until a user gesture (autoplay policy).
  // Resume on the first click/keypress so engine + environment sound plays.
  function resumeAudio() {
    try {
      var ctx = Module.SDL2 && Module.SDL2.audioContext;
      if (ctx && ctx.state !== 'running') { ctx.resume(); }
    } catch (e) {}
  }
  window.addEventListener('pointerdown', resumeAudio, true);
  window.addEventListener('keydown', resumeAudio, true);
</script>
{{{ SCRIPT }}}
</body>
</html>
