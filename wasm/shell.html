<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rigs of Rods (wasm)</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  #canvas{display:block;width:100vw;height:100vh;background:#000;outline:none}

  /* Boot overlay - covers the canvas until the engine takes over. */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:18px;background:#0b0d10;color:#c8d4e0;z-index:10}
  #boot.hidden{display:none}
  #boot h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.04em;color:#e8eef5}
  #bar{width:min(420px,72vw);height:6px;border-radius:3px;background:#1c222b;overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:3px;background:#5aa9e6;
         transition:width .15s linear}
  #bar.indeterminate>i{width:35%;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  #phase{font-size:13px;color:#8fa3b8;min-height:1.2em;text-align:center}
  #hint{font-size:12px;color:#5d6b7a;max-width:min(520px,84vw);text-align:center}
  #err{display:none;max-width:min(560px,86vw);padding:14px 16px;border-radius:8px;
       background:#2a1416;border:1px solid #63262b;color:#f0b8bc;font-size:13px;white-space:pre-wrap}
  #err.show{display:block}
  #err code{color:#ffd9dc}
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<div id="boot">
  <h1>Rigs of Rods</h1>
  <div id="bar" class="indeterminate"><i></i></div>
  <div id="phase">starting…</div>
  <div id="hint">First load downloads ~150&nbsp;MB of game data and needs ~1&nbsp;GB of free RAM. It is cached afterwards.</div>
  <div id="err"></div>
</div>

<!-- COOP/COEP via service worker. RoR is built with pthreads, so the page must be
     cross-origin isolated to get SharedArrayBuffer. Static hosts such as GitHub
     Pages cannot send those headers, so this shim injects them and reloads once.
     Must stay a *separate* <script src> - it registers itself via currentScript. -->
<script src="coi-serviceworker.js"></script>

<script>
  var bootEl  = document.getElementById('boot');
  var barEl   = document.getElementById('bar');
  var fillEl  = barEl.firstElementChild;
  var phaseEl = document.getElementById('phase');
  var errEl   = document.getElementById('err');

  function fail(msg) {
    errEl.innerHTML = msg;
    errEl.classList.add('show');
    barEl.style.display = 'none';
    phaseEl.textContent = '';
  }

  function setProgress(loaded, total) {
    barEl.classList.remove('indeterminate');
    fillEl.style.width = (total ? (loaded / total * 100) : 0).toFixed(1) + '%';
  }

  // Emscripten reports the preload package as "Downloading data... (loaded/total)".
  // The .wasm itself streams without progress events, so that phase stays
  // indeterminate.
  var DL_RE = /\((\d+)\s*\/\s*(\d+)\)/;

  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) {
      if (!t) { bootEl.classList.add('hidden'); return; }
      var m = DL_RE.exec(t);
      if (m) {
        var loaded = +m[1], total = +m[2];
        setProgress(loaded, total);
        phaseEl.textContent = 'downloading game data — ' +
          (loaded / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB';
      } else if (/Running/i.test(t)) {
        phaseEl.textContent = 'starting engine…';
        barEl.classList.add('indeterminate');
      } else {
        phaseEl.textContent = t;
      }
    },
  };

  // A page that is not cross-origin isolated has no SharedArrayBuffer, so the
  // pthread-enabled build cannot start at all. coi-serviceworker reloads once to
  // fix this; if we are still not isolated after that, it genuinely failed.
  window.addEventListener('load', function () {
    if (window.crossOriginIsolated === false) {
      fail('This page is not <b>cross-origin isolated</b>, so <code>SharedArrayBuffer</code> ' +
           'is unavailable and the multi-threaded build cannot start.<br><br>' +
           'Reload the page. If it keeps failing, the COOP/COEP service worker was blocked — ' +
           'private/incognito windows and browsers with service workers disabled cannot run this build.');
    }
  });

  window.addEventListener('error', function (e) {
    var msg = (e && e.message) || '';
    if (/SharedArrayBuffer|Out of memory|RangeError|WebAssembly\.Memory/i.test(msg)) {
      fail('The engine could not reserve its <b>1&nbsp;GB</b> heap.<br><br>' +
           'Close other tabs and reload. 32-bit and low-memory devices (most phones) ' +
           'cannot run this build.<br><br><code>' + msg + '</code>');
    }
  });

  // OpenAL (Web Audio) starts suspended until a user gesture (autoplay policy).
  // Resume on the first click/keypress so engine + environment sound plays.
  function resumeAudio() {
    try {
      var ctx = Module.SDL2 && Module.SDL2.audioContext;
      if (ctx && ctx.state !== 'running') { ctx.resume(); }
    } catch (e) {}
  }
  window.addEventListener('pointerdown', resumeAudio, true);
  window.addEventListener('keydown', resumeAudio, true);
</script>
{{{ SCRIPT }}}
</body>
</html>
